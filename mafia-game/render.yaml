services:
  - type: web
    name: levellio-mafia-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHZZK_CLIENT_ID
        sync: false
      - key: CHZZK_CLIENT_SECRET
        sync: false
      - key: CHZZK_REDIRECT_URI
        sync: false
      - key: ADMIN_CHZZK_CHANNEL_ID
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: levellio-mafia-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
